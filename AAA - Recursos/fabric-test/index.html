<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor de medallas</title>
</head>
<body>
  <h1>Editor de medallas</h1>

  
  <canvas id="c" width="600" height="600" style="border:1px solid #ccc;"></canvas>

 
  <div style="margin-top: 20px;">
    <p>
      <label for="fillColor">Fill: </label>
      <input type="color" id="fillColor" value="">
    </p>
    <p>
      <label for="fillColor2">Fill 2: </label>
      <input type="color" id="fillColor2" value="">
    </p>
    <p>
      <label for="gradientType">Type: </label>
      <select id="gradientType">
        <option value="linear">Linear</option>
        <option value="radial">Radial</option>
      </select>
    </p>
    <p>
      <label for="gradientAngle">Angle: </label>
      <input type="range" id="gradientAngle" value="0" min="0" max="360" step="1">
    </p>

    <p>
      <label for="strokeWidth">Stroke Width: </label>
      <input type="number" id="strokeWidth" value="" min="0" step="1">
    </p>
    <p>
      <label for="strokeType">Stroke Type: </label>
      <select id="strokeType">
        <option value="round">Round</option>
        <option value="bevel">Square</option>
        <option value="miter">Miter</option>
      </select>
    </p>
    <p>
      <label for="strokeColor">Stroke Color: </label>
      <input type="color" id="strokeColor" value="">
    </p>


    <p>
      <input type="button" id="download-png" value="Download as PNG">
      <input type="button" id="download-svg" value="Download as SVG">
    </p>
  </div>

  
  <script src="fabric.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
