<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet SVG v11 - Eye + Mouth States</title>
<style>
:root { --primary: #6366f1; --bg-canvas: radial-gradient(circle, #ffffff 0%, #f8fafc 100%); }
body {
  margin: 0; font-family: system-ui, -apple-system, sans-serif;
  background-color: #f1f5f9; display: flex;
  justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px 0;
}
.app-container {
  width: 95%; max-width: 1100px; background: white;
  border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
  display: grid; grid-template-columns: 1.15fr 0.85fr; overflow: hidden;
}
.clothes-badge {
  position: absolute; bottom: -95px; left: 730px; background: #f59e0b;
  color: white; padding: 4px 10px; border-radius: 6px;
  font-size: 11px; font-weight: bold; z-index: 20;
}
#clothes-selector button.active { background: #f59e0b; border-color: #d97706; color: white; }
.viewport-section {
  background: var(--bg-canvas); padding: 20px; position: relative;
  display: flex; justify-content: center; align-items: center;
  border-right: 1px solid #e2e8f0; min-height: 650px;
}
#pet-container {
  width: 100%; max-width: 650px; height: 650px;
  display: flex; justify-content: center; align-items: center; position: relative;
}
#pet-container svg { width: 100%; height: 100%; max-height: 650px; }
.controls-section { padding: 20px 24px; overflow-y: auto; max-height: 750px; }

/* Badges */
.state-badge {
  position: absolute; top: 14px; left: 14px; background: #0f172a;
  color: white; padding: 4px 10px; border-radius: 6px;
  font-size: 11px; font-weight: bold; text-transform: uppercase; z-index: 20;
}
.eye-badge {
  position: absolute; top: 14px; right: 14px; background: #6366f1;
  color: white; padding: 4px 10px; border-radius: 6px;
  font-size: 11px; font-weight: bold; z-index: 20;
}
.mouth-badge {
  position: absolute; bottom: 14px; left: 14px; background: #ec4899;
  color: white; padding: 4px 10px; border-radius: 6px;
  font-size: 11px; font-weight: bold; z-index: 20;
}

/* Grids */
.button-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 6px 0 14px 0; }
.state-grid  { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin: 6px 0 14px 0; }
.section-label {
  color: #64748b; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 5px 0;
}

/* Buttons */
button {
  padding: 9px 6px; border: 1.5px solid #e2e8f0;
  border-radius: 7px; background: white; cursor: pointer;
  font-weight: 600; font-size: 12px; transition: all 0.15s; line-height: 1.2;
}
button:hover { background: #f8fafc; transform: translateY(-1px); border-color: var(--primary); }
button.active { background: var(--primary); color: white; border-color: #4f46e5; }
button.mouth-active { background: #ec4899; color: white; border-color: #db2777; }
button.todo { border-style: dashed; color: #94a3b8; }
button.todo:hover { border-color: var(--primary); color: #6366f1; background: #eef2ff; }
#skin-selector button.active { background: #9b59b6; border-color: #8e44ad; color: white; }
button.heart-active { background: #ef4444; color: white; border-color: #dc2626; }
button.mouth-btn.active { background: #ec4899; border-color: #db2777; }


/* === ANIMATIONS === */
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }
.breathing #CUERPO { animation: breathe 3s ease-in-out infinite; transform-origin: 300px 350px; }
@keyframes armSway    { 0%, 100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(2.5deg) translateY(3px); } }
@keyframes armSwayAlt { 0%, 100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-2.5deg) translateY(3px); } }
.breathing #BRAZO_IZQ { animation: armSway 3s ease-in-out infinite; transform-origin: 50% 15%; transform-box: fill-box; }
.breathing #BRAZO_DER { animation: armSwayAlt 3s ease-in-out infinite; transform-origin: 50% 15%; transform-box: fill-box; }
@keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
.happy-jump { animation: jump 0.6s ease-out; }
@keyframes waveLeft  { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-28deg)} 75%{transform:rotate(12deg)} }
@keyframes waveRight { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(28deg)}  75%{transform:rotate(-12deg)} }
.happy-wave #BRAZO_IZQ, .happy-wave #MANOS g:last-child { animation: waveLeft  0.45s ease-in-out infinite; transform-origin: 50% 10%; transform-box: fill-box; }
.happy-wave #BRAZO_DER, .happy-wave #MANOS g:first-child { animation: waveRight 0.45s ease-in-out infinite; transform-origin: 50% 10%; transform-box: fill-box; }
@keyframes earSad { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-15deg); } }
.sad #OREJA1, .sad #OREJA2 { animation: earSad 2s ease-in-out infinite; transform-origin: center; }

/* Eyes blink */
.eye-ball, .eye-pupil { transition: transform 80ms ease-in-out; transform-box: fill-box; transform-origin: center center; }
.eye-shine { transition: opacity 80ms ease-in-out; }
svg.blinking .eye-ball, svg.blinking .eye-pupil { transform: scaleY(0.05); }
svg.blinking .eye-shine { opacity: 0; }

/* Heart */
#heart-container {
  position: absolute; bottom: 215px; left: 50%;
  transform: translateX(-50%) scale(0.8); pointer-events: none;
  opacity: 0; transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 5;
}
#heart-container.visible { opacity: 1; transform: translateX(-50%) scale(1); }
#heart-container.heart-beat { animation: heartBeat 1.5s ease-in-out infinite; }
@keyframes heartBeat {
  0%, 100% { transform: translateX(-50%) scale(1); }
  15% { transform: translateX(-50%) scale(1.15); }
  30% { transform: translateX(-50%) scale(1); }
  45% { transform: translateX(-50%) scale(1.1); }
}
#heart-container svg { width: 69px; height: 69px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }
</style>
</head>
<body>

<div class="app-container">
  <div class="viewport-section">
    <div id="status-label" class="state-badge">IDLE</div>
    <div id="eye-label"   class="eye-badge">👁 Idle</div>
    <div id="mouth-label" class="mouth-badge">👄 Idle</div>
    <div id="pet-container">
      <div id="pet-svg-wrapper"></div>
      <div id="heart-container">
        <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 85 C50 85 10 60 10 35 C10 15 30 5 50 25 C70 5 90 15 90 35 C90 60 50 85 50 85Z"
                fill="#ef4444" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

                fill="#fca5a5" opacity="0.6"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="controls-section">
    <h2 style="margin:0 0 4px 0; font-size:18px">Pet SVG v11</h2>

    <p class="section-label">Mascota</p>
    <div id="skin-selector" class="button-grid"></div>

    <p class="section-label">Ojos (18)</p>
    <div id="eye-selector" class="state-grid"></div>

    <p class="section-label">Bocas (20)</p>
    <div id="mouth-selector" class="state-grid"></div>

    <div id="clothes-label" class="clothes-badge">👕 Ninguna</div>

    <p class="section-label">Ropa</p>
    <div id="clothes-selector" class="state-grid"></div>

    <p class="section-label">Emoción</p>
    <div class="button-grid">
      <button onclick="engine.setState('HAPPY')" style="background-color: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">😄 Happy
      </button>
      <button onclick="engine.setState('IDLE')">😐 Reset</button>
    </div>

    <p class="section-label">Accesorios</p>
    <div class="button-grid">
      <button id="heart-btn" onclick="engine.toggleHeart()" style="grid-column: span 2;">
        ❤️ Sostener Corazón
      </button>
    </div>
  </div>
</div>

/* ══════════════════════════════════════════════════════════════════
   ENGINE v11
══════════════════════════════════════════════════════════════════ */
class PetEngineV11 {
  constructor(containerId) {
    this.container        = document.getElementById(containerId);
    this.svgWrapper       = this.container.querySelector('#pet-svg-wrapper');
    this.state            = 'IDLE';
    this.currentPet       = null;
    this.svgElement       = null;
    this.layers           = { eyes: [], pupils: [], shines: [] };
    this.blinkInterval    = null;
    this.blinkDuration    = 80;
    this.blinkSpeed       = 4000;
    this.heartVisible     = false;
    this.currentEyeState  = 'Idle';
    this.currentMouthState= 'Idle';
    this.heartBtn         = document.getElementById('heart-btn');
    this._renderInterface();
  }

  _renderInterface() {
    // Pet buttons
    const skinSel = document.getElementById('skin-selector');
    skinSel.innerHTML = '';
    Object.keys(COMPLEX_PETS).forEach(key => {
      const btn = document.createElement('button');
      btn.innerText = COMPLEX_PETS[key].name;
      btn.onclick = () => this.loadPet(key);
      btn.setAttribute('data-pet', key);
      skinSel.appendChild(btn);
    });

    // Eye buttons
    const eyeSel = document.getElementById('eye-selector');
    eyeSel.innerHTML = '';
    Object.keys(EYE_STATES).forEach(key => {
      const state = EYE_STATES[key];
      const isTodo = state.inject === 'TODO';
      const btn = document.createElement('button');
      btn.innerText = state.name;
      if (isTodo) btn.classList.add('todo');
      btn.onclick = () => this.setEyeState(key);
      btn.setAttribute('data-eye', key);
      eyeSel.appendChild(btn);
    });

    // Mouth buttons
    const mouthSel = document.getElementById('mouth-selector');
    mouthSel.innerHTML = '';
    Object.keys(MOUTH_STATES).forEach(key => {
      const state = MOUTH_STATES[key];
      const isTodo = state.inject === 'TODO';
      const btn = document.createElement('button');
      btn.innerText = state.name;
      btn.classList.add('mouth-btn');
      if (isTodo) btn.classList.add('todo');
      btn.onclick = () => this.setMouthState(key);
      btn.setAttribute('data-mouth', key);
      mouthSel.appendChild(btn);
    });

    // Clothes buttons
    const clothesSel = document.getElementById('clothes-selector');
    clothesSel.innerHTML = '';
    Object.keys(CLOTHING_STATES).forEach(key => {
      const state = CLOTHING_STATES[key];
      const btn = document.createElement('button');
      btn.innerText = state.name;
      btn.onclick = () => this.setClothesState(key);
      btn.setAttribute('data-clothes', key);
      clothesSel.appendChild(btn);
    });
  }

  loadPet(key) {
      if (!COMPLEX_PETS[key]) return;
      this.currentPet = key;
      this.svgWrapper.innerHTML = COMPLEX_PETS[key].svg;
      this.svgElement = this.svgWrapper.querySelector('svg');
      
      // NUEVO: Asegurarnos de que existe el contenedor de Ropa en el SVG cargado
      if (!this.svgElement.querySelector('#ROPA')) {
        const ropaGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        ropaGroup.id = "ROPA";
        const patasGroup = this.svgElement.querySelector('#PATAS');
        // Lo insertamos justo antes de las patas para que no tape los brazos
        if (patasGroup) this.svgElement.insertBefore(ropaGroup, patasGroup);
        else this.svgElement.appendChild(ropaGroup);
      }

      document.querySelectorAll('#skin-selector button').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-pet="${key}"]`)?.classList.add('active');
      
      this._applyEyeState();
      this._applyMouthState();
      this._applyClothesState(); // NUEVO
      
      this._stopBlinking();
      this.setState('IDLE');
      this.heartVisible = false;
      this._updateHeartUI();
    }
  setState(newState) {
    this.state = newState;
    document.getElementById('status-label').innerText = newState;
    this.container.className = '';
    if (newState === 'SAD') { this.blinkSpeed = 6000; this.blinkDuration = 150; }
    else                   { this.blinkSpeed = 4000; this.blinkDuration = 80;  }
    this._stopBlinking();
    if (this._eyeStateIsDynamic()) this._startBlinking();
    if (newState === 'IDLE')       this.container.classList.add('idle', 'breathing');
    else if (newState === 'HAPPY') { this.container.classList.add('happy', 'breathing', 'happy-jump', 'happy-wave'); setTimeout(() => this.container.classList.remove('happy-jump'), 600); }
    else if (newState === 'SAD')   this.container.classList.add('sad', 'breathing');
    else if (newState === 'EATING'){ this.container.classList.add('breathing'); this._animateMouth(); }
    // Only update mouth from emotion if mouth state is Idle (dynamic)
    if (this._mouthStateIsDynamic()) this._updateMouthShape();
  }

  /* ── Eye state ── */
  setEyeState(key) {
    if (!EYE_STATES[key]) return;
    this.currentEyeState = key;
    document.querySelectorAll('#eye-selector button').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-eye="${key}"]`)?.classList.add('active');
    document.getElementById('eye-label').innerText = '👁 ' + EYE_STATES[key].name;
    this._applyEyeState();
    this._stopBlinking();
    if (this._eyeStateIsDynamic()) this._startBlinking();
  }

  _eyeStateIsDynamic() {
    const s = EYE_STATES[this.currentEyeState];
    return !s || s.inject === null || s.inject === 'TODO';
  }

  _applyEyeState() {
    if (!this.svgElement) return;
    const ojosGroup = this.svgElement.querySelector('#OJOS');
    if (!ojosGroup) return;
    const state = EYE_STATES[this.currentEyeState];
    if (!state || state.inject === null || state.inject === 'TODO') { this._renderAdorableEyes(); return; }
    this.layers = { eyes: [], pupils: [], shines: [] };
    ojosGroup.innerHTML = state.inject;
  }

  /* ── Mouth state ── */
  setMouthState(key) {
    if (!MOUTH_STATES[key]) return;
    this.currentMouthState = key;
    document.querySelectorAll('#mouth-selector button').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-mouth="${key}"]`)?.classList.add('active');
    document.getElementById('mouth-label').innerText = '👄 ' + MOUTH_STATES[key].name;
    this._applyMouthState();
  }

  _mouthStateIsDynamic() {
    const s = MOUTH_STATES[this.currentMouthState];
    return !s || s.inject === 'TODO';
  }

  _applyMouthState() {
    if (!this.svgElement) return;
    const bocaGroup = this.svgElement.querySelector('#BOCA');
    if (!bocaGroup) return;
    const state = MOUTH_STATES[this.currentMouthState];
    // TODO or missing → keep original polyline, let emotion control it
    if (!state || state.inject === 'TODO') { this._updateMouthShape(); return; }
    bocaGroup.innerHTML = state.inject;
  }

  /* ── Clothes state ── */
  setClothesState(key) {
    if (!CLOTHING_STATES[key]) return;
    this.currentClothesState = key;
    document.querySelectorAll('#clothes-selector button').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-clothes="${key}"]`)?.classList.add('active');
    document.getElementById('clothes-label').innerText = '👕 ' + CLOTHING_STATES[key].name;
    this._applyClothesState();
  }

  _applyClothesState() {
    if (!this.svgElement) return;
    const ropaGroup = this.svgElement.querySelector('#ROPA');
    if (!ropaGroup) return;
    const state = CLOTHING_STATES[this.currentClothesState];
    if (!state || !state.inject) {
      ropaGroup.innerHTML = '';
      return;
    }
    ropaGroup.innerHTML = state.inject;
  }

  /* ── Heart ── */
  toggleHeart() {
    this.heartVisible = !this.heartVisible;
    this._updateHeartUI();
  }
  _updateHeartUI() {
    const hc = document.getElementById('heart-container');
    if (!hc) return;
    if (this.heartVisible) {
      hc.classList.add('visible', 'heart-beat');
      this.heartBtn.classList.add('heart-active');
      this.heartBtn.innerHTML = '💖 Soltar Corazón';
    } else {
      hc.classList.remove('visible', 'heart-beat');
      this.heartBtn.classList.remove('heart-active');
      this.heartBtn.innerHTML = '❤️ Sostener Corazón';
    }
  }

  /* ── Dynamic mouth (emotion-driven) ── */
  _updateMouthShape() {
    if (!this.svgElement) return;
    const bocaGroup = this.svgElement.querySelector('#BOCA');
    if (!bocaGroup) return;
    // Restore polyline for emotion control
    bocaGroup.innerHTML = '<polyline fill="none" stroke="#000" stroke-linecap="round" stroke-miterlimit="10" stroke-width="6"/>';
    const mouth = bocaGroup.querySelector('polyline');
    if      (this.state === 'SAD')    mouth.setAttribute('points', '272.29 346.71 300 334.75 327.71 346.71');
    else if (this.state === 'EATING') mouth.setAttribute('points', '290 340 300 340 310 340');
    else                              mouth.setAttribute('points', '272.29 334.71 300 346.75 327.71 334.71');
  }

  _animateMouth() {
    if (this.state !== 'EATING') return;
    // Only animate if in dynamic mode
    if (!this._mouthStateIsDynamic()) return;
    const bocaGroup = this.svgElement.querySelector('#BOCA');
    if (!bocaGroup) return;
    const mouth = bocaGroup.querySelector('polyline');
    if (!mouth) return;
    mouth.style.strokeLinejoin = 'round';
    const seq = [
      "290 340 293 333 300 331 307 333 310 340 307 347 300 349 293 347 290 340",
      "288 345 300 345 312 345"
    ];
    let step = 0;
    const interval = setInterval(() => {
      if (this.state !== 'EATING') {
        clearInterval(interval); mouth.style.strokeLinejoin = 'miter';
        mouth.setAttribute('points', '272.29 334.71 300 346.75 327.71 334.71'); return;
      }
      mouth.setAttribute('points', seq[step]); step = (step + 1) % seq.length;
    }, 250);
  }

  /* ── Dynamic eyes ── */
  _renderAdorableEyes() {
    if (!this.svgElement) return;
    const petData = COMPLEX_PETS[this.currentPet];
    if (!petData?.eyes) return;
    const ojosGroup = this.svgElement.querySelector('#OJOS');
    if (!ojosGroup) return;
    this.layers = { eyes: [], pupils: [], shines: [] };
    ojosGroup.innerHTML = '';
    petData.eyes.forEach(data => {
      const mk = (cx, cy, r, fill, cls) => {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
        c.setAttribute('fill', fill); c.setAttribute('class', cls);
        ojosGroup.appendChild(c); return c;
      };
      this.layers.eyes.push(mk(data.x, data.y, data.r, 'white', 'eye-ball'));
      this.layers.pupils.push(mk(data.x, data.y, data.r*0.85, '#0f172a', 'eye-pupil'));
      this.layers.shines.push(mk(data.x - data.r*0.3, data.y - data.r*0.3, data.r*0.25, 'white', 'eye-shine'));
    });
  }

  /* ── Blink ── */
  _startBlinking() {
    if (this.blinkInterval) clearInterval(this.blinkInterval);
    const blink = (cb) => {
      if (!this.svgElement) return;
      this.svgElement.classList.add('blinking');
      setTimeout(() => { if (this.svgElement) this.svgElement.classList.remove('blinking'); if (cb) cb(); }, this.blinkDuration);
    };
    const schedule = () => {
      const wait = this.blinkSpeed * 0.6 + Math.random() * this.blinkSpeed * 0.8;
      this.blinkInterval = setTimeout(() => {
        if (!this.svgElement) return;
        if (Math.random() < 0.18) blink(() => setTimeout(() => blink(schedule), 120));
        else blink(schedule);
      }, wait);
    };
    this.blinkInterval = setTimeout(() => blink(schedule), Math.random() * 1500 + 500);
  }
  _stopBlinking() {
    if (this.blinkInterval) { clearTimeout(this.blinkInterval); this.blinkInterval = null; }
    if (this.svgElement) this.svgElement.classList.remove('blinking');
  }
}

/* ── Init ── */
const engine = new PetEngineV11('pet-container');
window.onload = () => {
  engine.loadPet('Bunny');
  engine.setEyeState('Idle');
  engine.setMouthState('Idle');
  engine.setClothesState('None'); // Iniciar sin ropa
};
</script>
