<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No activity icon">
  <!-- Fondo circular -->
  <circle cx="64" cy="64" r="60" fill="#F5F5F5" stroke="#D32F2F" stroke-width="6"/>

  <!-- Icono de pausa (actividad detenida) -->
  <rect x="46" y="38" width="10" height="32" rx="2" fill="#616161"/>
  <rect x="72" y="38" width="10" height="32" rx="2" fill="#616161"/>

  <!-- Base como si fuera una gráfica parada -->
  <rect x="32" y="78" width="64" height="8" rx="2" fill="#BDBDBD"/>

  <!-- Línea de prohibición (no actividad) -->
  <line x1="32" y1="32" x2="96" y2="96" stroke="#D32F2F" stroke-width="8" stroke-linecap="round"/>
</svg>
